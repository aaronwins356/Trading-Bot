[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tradebot"
version = "0.1.0"
description = "Open-source algorithmic trading platform: Jesse-style strategies, bias-free backtesting, walk-forward research, paper/live trading via CCXT, risk management, a web dashboard, and JEV - an open-source LLM decision engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Aaron" }]
keywords = ["trading", "algorithmic-trading", "backtesting", "crypto", "ccxt", "llm", "quant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ccxt>=4.3",
    "optuna>=3.6",
]

[project.optional-dependencies]
research = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "matplotlib>=3.8",
]

[project.scripts]
tradebot = "tradebot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are fine in tables/prompts
    "RUF001",  # ambiguous unicode in strings (used in docs/prompts)
    "RUF002",
    "RUF003",
    "B008",    # FastAPI Depends() in defaults
    "SIM108",
    "RUF012",  # class-level mutable defaults are used intentionally in strategy metadata
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
